[workspace]
resolver = "2"
members = [
    "crates/vn-runtime",    # JS host: context boot, pump, bridge, host_fn!
    "crates/vn-tree",       # retained node tree + renderer host fns
    "crates/vn-css",        # stylesheets, cascade, per-state refinements
    "crates/vn-elements",   # native widgets (text input, ...)
    "crates/vn-effects",    # `--shading` registry + .slang sources + generated HLSL
    "crates/vn-lottie",     # Lottie/.tgs playback behind the `<lottie>` element
    "crates/vn-thorvg-sys", # vendored ThorVG C++ + checked-in FFI (vn-lottie's `thorvg` feature)
    # "crates/vn-window",   # window chrome: backdrops, dark mode, titlebar
    "crates/vn-app",        # host binary shell
]
# Path deps inside the workspace directory auto-join the workspace unless
# excluded; vendor crates must resolve against their OWN workspace roots
# (zed's / redjs's) for `.workspace = true` field inheritance.
#
# regen-bindings is a CONTRIBUTOR tool that depends on `bindgen` (and so on
# libclang). Excluding it keeps that dependency out of the workspace lockfile
# entirely — `cargo build` here never resolves it. Same split as
# crates/vn-effects' slangc.
exclude = ["vendor", "crates/vn-thorvg-sys/tools/regen-bindings"]

# Replicated from vendor/zed's workspace root: gpui depends on async-task
# APIs that only exist on this fork rev, and [patch] sections apply only from
# THIS workspace root, never from a path dependency's own workspace.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

# vendor/redjs is a git submodule (https://github.com/argon-chat/redjs) consumed as a
# path dep (vendor/redjs/redjs). NOTE: it currently path-depends on `../../redcss`
# (PEWPEW's CSS crate) unconditionally — until that dep is feature-gated upstream,
# building redjs from this workspace requires either the PEWPEW checkout or a
# vendor/redcss stub. Tracked in docs/ARCHITECTURE.md §5.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
