[workspace]
resolver = "2"
members = [
    "crates/sk-runtime",    # JS host: context boot, pump, bridge, host_fn!
    "crates/sk-tree",       # retained node tree + renderer host fns
    "crates/sk-css",        # stylesheets, cascade, per-state refinements
    "crates/sk-elements",   # native widgets (text input, ...)
    "crates/sk-effects",    # `--shading` registry + .slang sources + generated HLSL
    "crates/sk-lottie",     # Lottie/.tgs playback behind the `<lottie>` element
    "crates/sk-sticker",    # <sk-sticker>: Lottie + VP9-alpha stickers, shared decoders, loop cache
    "crates/sk-video",      # <video> playback: portable core + the Media Foundation backend
    "crates/sk-permissions",# platform permission backends behind redjs's navigator.permissions
    "crates/sk-locale",     # the SDK's own text in the user's language; appLocale for an app's
    "crates/sk-storage",    # localStorage on a disk: folders, atomic writes, DPAPI at rest
    "crates/sk-clipboard",  # navigator.clipboard over the SAME gpui clipboard the <input> uses
    "crates/sk-webview",    # <iframe>: a document in the platform webview (WebView2), under the app surface
    "crates/sk-thorvg-sys", # ThorVG C++ submodule + checked-in FFI (sk-lottie's `thorvg` feature)
    "crates/sk-vpx-sys",    # vendored libvpx VP9 decoder (cc, no nasm) + a safe wrapper (sk-sticker's video)
    "crates/sk-yuv",        # I420 + alpha to straight BGRA at any size, SIMD (optimised in dev, below)
    "crates/sk-payload",    # SKPK v1 (a packaged exe's app payload) + the one URL→asset-key normaliser
    "crates/sk-desktop",    # argv parser, shell (open/reveal/trash), single instance, custom protocols
    "crates/sk-hotkeys",    # system-wide hotkeys: Windows low-level hooks, macOS event tap, chord engine
    "crates/sk-audio",      # spatial audio output: Windows ISpatialAudioClient objects behind redjs's Web Audio
    "crates/sk-resample",   # the downscaled image copies' pixel kernel (optimised in dev, below)
    "crates/sk-app",        # host binary shell
    "crates/skathi",        # the facade an embedder depends on
    "crates/skathi-macros", # #[skathi::module] and #[skathi::data]
]
# Vendor crates must resolve against their own workspace roots (gpui's, redjs's).
# regen-bindings needs bindgen/libclang; excluded to keep that out of the lockfile.
exclude = ["vendor", "crates/sk-image", "crates/sk-thorvg-sys/tools/regen-bindings"]

[workspace.package]
version = "0.6.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/argon-chat/skathi"
homepage = "https://skathi.land"

# Replicated from vendor/gpui, as [patch] applies only from the workspace root: the waker
# identity fix (smol-rs/async-task#108) is merged upstream but not yet released.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
# gpui pins skathi-taffy =0.15.0, the argon-chat/taffy fork in vendor/taffy (branch `vue-native`:
# upstream v0.15.0 plus patches, each marked "vue-native patch" in the source).
skathi-taffy = { path = "vendor/taffy" }

[profile.release]
# "s" takes ~7.5 MB off a host. The crates below stay at 3: at "s", layout, prepaint and paint
# took 15-30% longer per frame. Under LTO the final crate's level sets the pipeline for every
# crate, so sk-app is among them.
opt-level = "s"
lto = "thin"
codegen-units = 1
# MSVC passes /DEBUG to link.exe regardless, so debug info of the vendored static libs
# (JSC, redjs glue, yoga) landed in a 326 MB PDB; sk-app/build.rs passes /DEBUG:NONE for release.
debug = false
# No-op on windows-msvc (symbols live in the PDB); kept for other targets.
strip = "symbols"
# Not set on purpose: `panic = "abort"` (the JS bridge catches native panics, see
# sk_runtime::bridge::poisoned).

[profile.release.package]
sk-app.opt-level = 3
sk-runtime.opt-level = 3
sk-tree.opt-level = 3
sk-css.opt-level = 3
sk-elements.opt-level = 3
sk-effects.opt-level = 3
skathi-gpui.opt-level = 3
skathi-gpui-windows.opt-level = 3
skathi-gpui-macos.opt-level = 3
skathi-gpui-linux.opt-level = 3
skathi-gpui-wgpu.opt-level = 3
skathi-gpui-refineable.opt-level = 3
skathi-gpui-sum-tree.opt-level = 3
skathi-gpui-collections.opt-level = 3
skathi-gpui-util.opt-level = 3
skathi-gpui-scheduler.opt-level = 3
skathi-taffy.opt-level = 3
# Pixel and audio kernels: "s" turns off loop vectorisation.
sk-resample.opt-level = 3
sk-yuv.opt-level = 3
image.opt-level = 3
png.opt-level = 3
zune-jpeg.opt-level = 3
zune-inflate.opt-level = 3
image-webp.opt-level = 3
fdeflate.opt-level = 3
miniz_oxide.opt-level = 3
tiny-skia.opt-level = 3
tiny-skia-path.opt-level = 3
rubato.opt-level = 3
fixed-resample.opt-level = 3
symphonia-core.opt-level = 3
symphonia-codec-vorbis.opt-level = 3
symphonia-bundle-mp3.opt-level = 3
symphonia-codec-aac.opt-level = 3

# Release plus symbols for crash dumps. `SK_PDB=1` does the same for a plain `release` build.
[profile.release-symbols]
inherits = "release"
strip = "none"
debug = true

# Dependencies are optimised in dev: unoptimised taffy layout and cascade dominated frame time.
# Line tables only: their full debug info was nearly half of the PDB every relink rewrites.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# Pixel kernel: generic `image::imageops::resize` compiles at the calling crate's opt-level.
[profile.dev.package.sk-resample]
opt-level = 3

# Same reason: SIMD intrinsics are function calls at opt-level 0.
[profile.dev.package.sk-yuv]
opt-level = 3
