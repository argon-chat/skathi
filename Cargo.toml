[workspace]
resolver = "2"
members = [
    "crates/vn-runtime",    # JS host: context boot, pump, bridge, host_fn!
    "crates/vn-tree",       # retained node tree + renderer host fns
    "crates/vn-css",        # stylesheets, cascade, per-state refinements
    "crates/vn-elements",   # native widgets (text input, ...)
    "crates/vn-effects",    # `--shading` registry + .slang sources + generated HLSL
    "crates/vn-lottie",     # Lottie/.tgs playback behind the `<lottie>` element
    "crates/vn-sticker",    # <vn-sticker>: Lottie + VP9-alpha stickers, shared decoders, loop cache
    "crates/vn-video",      # <video> playback: portable core + the Media Foundation backend
    "crates/vn-voice",      # LiveKit voice: the actor, the playout mixer, the JS host fns
    "crates/vn-permissions",# platform permission backends behind redjs's navigator.permissions
    "crates/vn-storage",    # localStorage on a disk: folders, atomic writes, DPAPI at rest
    "crates/vn-clipboard",  # navigator.clipboard over the SAME gpui clipboard the <input> uses
    "crates/vn-thorvg-sys", # vendored ThorVG C++ + checked-in FFI (vn-lottie's `thorvg` feature)
    "crates/vn-vpx-sys",    # vendored libvpx VP9 decoder (cc, no nasm) + a safe wrapper (vn-sticker's video)
    "crates/vn-yuv",        # I420 + alpha to straight BGRA at any size, SIMD (optimised in dev, below)
    "crates/vn-payload",    # VNPK v1 (a packaged exe's app payload) + the one URL→asset-key normaliser
    "crates/vn-desktop",    # argv parser, shell (open/reveal/trash), single instance, custom protocols
    "crates/vn-resample",   # the downscaled image copies' pixel kernel (optimised in dev, below)
    # "crates/vn-window",   # window chrome: backdrops, dark mode, titlebar
    "crates/vn-app",        # host binary shell
]
# Path deps inside the workspace directory auto-join the workspace unless
# excluded; vendor crates must resolve against their OWN workspace roots
# (zed's / redjs's) for `.workspace = true` field inheritance.
#
# regen-bindings is a CONTRIBUTOR tool that depends on `bindgen` (and so on
# libclang). Excluding it keeps that dependency out of the workspace lockfile
# entirely — `cargo build` here never resolves it. Same split as
# crates/vn-effects' slangc.
exclude = ["vendor", "crates/vn-thorvg-sys/tools/regen-bindings"]

# Replicated from vendor/zed's workspace root: gpui depends on async-task
# APIs that only exist on this fork rev, and [patch] sections apply only from
# THIS workspace root, never from a path dependency's own workspace.
#
# m24: moved with zed#65274 from smol-rs rev b4486cd7 to zed-industries' pin of
# the waker-identity fix under review as smol-rs/async-task#108 (a clone of a
# task waker got a different vtable than the original, so `will_wake` lied and
# futures were woken over and over).
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
# m26: taffy 0.13.0 (gpui pins `=0.13.0`, vendor/zed/Cargo.toml) with ONE
# backported fix: `justify-content` no longer also distributes the free space
# auto margins already took (a `mx-auto` item in a `justify-center` row moved
# twice as far). Upstream fixed it in taffy 0.14.0; the vendored copy is the
# 0.13.0 crate as published plus that change, marked in
# vendor/taffy/src/compute/flexbox.rs. Drop the backport when gpui moves to a
# taffy >= 0.14.
# ...and one vue-native patch that stays: `TaffyTree::resolve_calc_value`
# decodes the calc() handle gpui packs for `DefiniteLength::Calc`
# (vendor/taffy/src/tree/taffy_tree.rs; upstream resolves every calc to 0).
# ...and a second one: a min/max size transfers through `aspect-ratio` only
# into an axis whose size is auto (`Size::maybe_transfer_aspect_ratio`,
# vendor/taffy/src/geometry.rs; css-sizing-4 §5.2). Upstream caps a definite
# `height: 100%` at `max-width / ratio`, so a picture under Tailwind's
# `img { max-width: 100% }` kept its own shape in a box it should fill.
# ...and a third: a percentage `flex-basis` the container cannot resolve is
# `content` (CSS Flexbox §7.2.3), not the item's own width/height
# (`determine_flex_base_size`, vendor/taffy/src/compute/flexbox.rs).
# Moving off the vendored copy means carrying all three patches to the new
# taffy.
taffy = { path = "vendor/taffy" }
# m26: webrtc-sys 0.3.41 (pinned `=0.3.41` by crates/vn-voice) as published,
# plus vue-native hooks libwebrtc has and the crate does not expose — the
# network-adapter filter (crates/vn-voice/src/netfilter.rs) and the TURN-over-
# TLS certificate verifier (crates/vn-voice/src/tlsverify.rs). The exact hunks
# are listed in vendor/webrtc-sys/VENDOR.md, so a bump is mechanical.
webrtc-sys = { path = "vendor/webrtc-sys" }

# vendor/redjs is a git submodule (https://github.com/argon-chat/redjs) consumed as a
# path dep (vendor/redjs/redjs). NOTE: it currently path-depends on `../../redcss`
# (PEWPEW's CSS crate) unconditionally — until that dep is feature-gated upstream,
# building redjs from this workspace requires either the PEWPEW checkout or a
# vendor/redcss stub. Tracked in docs/ARCHITECTURE.md §5.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Until m22 the two lines below were absent, so Cargo's defaults applied
# (`debug = false`, `strip = "none"`) — and on MSVC that pair is not "no debug
# info": rustc passes `/DEBUG` to link.exe anyway, the linker aggregates
# whatever the vendored static libraries carry (the bun-webkit JSC prebuilt,
# redjs's C++ glue, yoga), and a **326 MB `vn_app.pdb`** landed beside the exe.
# "Release" meant optimized and LTO'd; nobody had checked what it weighed
# (research/reports/m21/devtools-v2.md §11.2).
#
# `debug = false` is Cargo's default and is written down anyway: it is the line
# somebody reads before asking why there is a PDB.
debug = false
# MEASURED TO DO NOTHING ON THIS TARGET, and kept anyway. `-C strip` is a Unix
# `strip(1)` operation: a windows-msvc image has no symbol table to remove (they
# live in the PDB), and Cargo does not translate this into the `/DEBUG:NONE`
# that would suppress one. The A/B, same tree, same features, only this line
# differing: `"none"` and `"symbols"` both produced a **97 002 496-byte exe and
# a 325 939 200-byte PDB** — identical in both files (m22 report §5).
#
# It stays because it is correct and free on every other target we might build
# for, and because deleting a setting that measures as a no-op invites somebody
# to add it back without measuring. The MSVC half of the job is done where it
# works: `crates/vn-app/build.rs` passes `/DEBUG:NONE` to the linker for release
# builds, and the `release-symbols` profile below opts back in.
strip = "symbols"
# NOT set, deliberately, and both are load-bearing omissions:
#
# * `panic = "abort"` would break safety invariant I9 (docs/ARCHITECTURE.md §1):
#   the JS bridge CATCHES native panics (`vn_runtime::bridge::poisoned()`) so a
#   panic inside a host fn poisons the runtime instead of taking the process
#   down mid-frame. `abort` deletes that seam and turns every recoverable bug
#   into a crash dump.
# * `opt-level = "s"`/`"z"` would trade frame time for bytes on an image whose
#   size is dominated by a statically linked JavaScriptCore rather than by our
#   own codegen — `vn-*` is a few MB of a ~50 MB exe. Unmeasured either way, so
#   it stays at 3: the cascade and the renderer are what this project profiles,
#   and a size win big enough to justify it would have to be measured first.

# Release, plus the symbols a crash dump needs.
#
# `cargo build --profile release-symbols -p vn-app --features prod` — the same
# code as `release` (same opt-level, same LTO, same codegen-units), emitting the
# PDB that `release` now suppresses. It exists because the m13 voice flake was
# diagnosed out of a libwebrtc `RTC_CHECK` abort with no Rust panic message
# (research/reports/m13/voice-flake.md §5), and that hunt is impossible without
# symbols for the vendored static libraries. Artifacts land in
# `target/<triple>/release-symbols/`, so a symbol build never overwrites the
# shippable one.
#
# `crates/vn-app/build.rs` reads the profile DIRECTORY out of `OUT_DIR` and only
# suppresses the PDB for the one called `release`, so this profile needs nothing
# but its name. `VN_PDB=1` in the environment does the same for a `release`
# build, for the case where the binary already exists and rebuilding under
# another profile would change the addresses in the dump you are holding.
[profile.release-symbols]
inherits = "release"
strip = "none"
debug = true

# Dependencies are optimized even in a debug build; our own crates are not.
#
# This is a PERFORMANCE-OF-THE-DEV-LOOP setting, and it was measured rather than
# assumed (research/reports/m11/perf-restyle-rebuild.md §5). With the cascade
# fixed, what was left of a mutation frame on `apps/shadcn` was gpui's own
# element work — and three quarters of THAT was taffy's `compute_layout` running
# unoptimized: 31 ms to lay out 548 nodes. The same is true of parcel_selectors
# inside the cascade and of gpui's scene building. None of it is code we debug;
# all of it runs on every frame.
#
# `"*"` covers dependencies only, so `vn-*` keep full debug info and cheap
# incremental rebuilds — the edit-compile-run loop is unchanged. The cost is one
# slower build the first time after this line changes (and after a `cargo
# clean`), because every dependency, gpui included, is rebuilt.
[profile.dev.package."*"]
opt-level = 2

# The one workspace crate that is optimised in dev: the downscaled image copies'
# pixel kernel. It reads every source pixel, and `image::imageops::resize` is
# generic, so it compiles at the calling crate's level. Inside vn-tree that was
# opt-level 0: one image took 659 ms on the painting thread in a debug build
# (research/reports/m26/perf-mem-1.md). Nobody steps through it, and it is
# small, so the rebuild cost is nothing.
[profile.dev.package.vn-resample]
opt-level = 3

# The video stickers' pixel kernel, for the same reason: it touches every
# decoded pixel of every frame on the sticker worker, and at opt-level 0 its
# SIMD intrinsics are function calls.
[profile.dev.package.vn-yuv]
opt-level = 3
