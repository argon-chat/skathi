# +crt-static: the JSC prebuilt, redjs's C++ glue and yoga are all /MT; mixing libcmt with
# msvcrt gives two heaps and allocator-crossing crashes.
#
# /STACK 8 MiB reserve, 1 MiB commit: the default 1 MiB gives JSC only ~8k JS frames; Vue's
# patch/unmount recursion needs more. The commit applies to every thread (~130 MB of commit
# charge); sk-app.exe lowers it in build.rs, and editing rustflags here would rebuild everything.
#
# An explicit `build.target` keeps build scripts and proc macros compiled for the host without
# these rustflags, in a single target/<triple>/ tree. On macOS override it per command
# (`--target aarch64-apple-darwin`); a project config wins over the user's.
[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/STACK:8388608,1048576"]

# Hooks Bun defines for its WebKit: weak references in the JSC prebuilt that stay undefined. Every
# binary linking the engine needs them, test binaries included, not only sk-app (its build.rs).
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-U,_Bun__reportUnhandledError",
  "-C", "link-arg=-Wl,-U,_Bun__thisThreadHasVM",
  "-C", "link-arg=-Wl,-U,_WTFTimer__cancel",
  "-C", "link-arg=-Wl,-U,_WTFTimer__create",
  "-C", "link-arg=-Wl,-U,_WTFTimer__deinit",
  "-C", "link-arg=-Wl,-U,_WTFTimer__isActive",
  "-C", "link-arg=-Wl,-U,_WTFTimer__secondsUntilTimer",
  "-C", "link-arg=-Wl,-U,_WTFTimer__update",
]

[env]
# The bun-webkit prebuilt is fetched by vendor/redjs/setup.ps1 (setup.sh on macOS) into
# vendor/redjs/prebuilt/; redjs's build.rs finds it there (a set BUN_WEBKIT_DIR still wins), or
# fetches it into its own cache (REDJS_CACHE_DIR), and refuses any version other than the one in
# vendor/redjs/redjs/pins.txt.
#
# Oldest macOS targeted (what the JSC prebuilt was built for); without it cc and rustc default
# to 11.0 on arm64 and ld warns about every engine object.
MACOSX_DEPLOYMENT_TARGET = "13.0"
