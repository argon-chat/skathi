name: Release

# A `v<version>` tag publishes the prebuilt hosts `sk build` and `sk dev` download (cli/host-fetch.ts):
# every published variant and the dev host for Windows x64, macOS arm64 and Linux x64, gzipped, plus
# hosts.json, and the full ICU data the Windows and Linux prod hosts leave out (sk-icu-*.dat.gz, shipped by
# `sk build` as icu.skpk); then @skathi-native/runtime and @skathi-native/cli at that version to npm, and the Rust
# crates (skathi and everything under it) to crates.io (scripts/publish-crates.ts).
# Every Windows host carries the native AOT loader (apps built with --aot run from their image), the
# ones with devtools embed the inspector's native image (scripts/aot/prepare-inspector.ts), and the sk-aot
# that compiled it (.github/workflows/sk-aot.yml) is published beside them for `sk build --aot`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, v<packages/cli version>"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sk-aot:
    uses: ./.github/workflows/sk-aot.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  hosts:
    name: Hosts (${{ matrix.name }})
    needs: [sk-aot]
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: hosts-windows
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: hosts-macos
          # The hosts run on this glibc or newer: keep it the oldest distribution supported.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hosts-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: ${{ matrix.target }}
      - name: Check the tag
        shell: bash
        run: bun scripts/release-hosts.ts --check-tag "$TAG"
      - if: runner.os == 'Windows'
        name: Cache the native AOT toolchain
        uses: actions/cache@v4
        with:
          path: .tools/native-aot
          key: windows-native-inspector-${{ hashFiles('packages/cli/aot/toolchain.lock.json', 'scripts/aot/generate-table.ts', 'vendor/redjs/redjs/pins.txt') }}
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: sk-aot-windows-x64
          path: .tools/sk-aot
      - if: runner.os == 'Windows'
        name: Unpack sk-aot
        shell: bash
        run: gzip -dc .tools/sk-aot/sk-aot-windows-x64.exe.gz > .tools/sk-aot/sk-aot.exe
      # pwsh, not bash: Git's /usr/bin/link.exe shadows MSVC's on bash's PATH.
      - if: runner.os == 'Windows'
        name: Build the hosts (with the native AOT loader, inspector and sk-aot)
        shell: pwsh
        run: >-
          bun scripts/aot/prepare-inspector.ts --out release-inspector --cache .tools/native-aot --compiler .tools/sk-aot/sk-aot.exe &&
          bun scripts/release-hosts.ts --out release-hosts --native-inspector release-inspector/build.json
      - if: runner.os != 'Windows'
        name: Build the hosts
        run: bun scripts/release-hosts.ts --out release-hosts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-hosts/
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [hosts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: hosts-*
          path: release-hosts
          merge-multiple: true
      - run: bun install --frozen-lockfile
      - name: Write hosts.json
        run: bun scripts/release-hosts.ts --merge release-hosts
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: |
            release-hosts/*.gz
            release-hosts/hosts.json

  # Windows, where every crate's packaged sources are verified to build. The first release of a crate
  # is rate-limited by crates.io (5, then one per 10 minutes) and can outlast the job: re-run it, and
  # it goes on from the first crate crates.io does not have.
  crates:
    name: crates.io
    needs: [publish]
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: x86_64-pc-windows-msvc
      - name: Publish
        shell: pwsh
        run: bun scripts/publish-crates.ts --tag "$env:TAG"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@11.5.1
      - run: bun install --frozen-lockfile
      - name: Check the tag
        run: bun scripts/release-hosts.ts --check-tag "$TAG"
      # bun pm pack writes workspace:* as the real version; the licenses live at the repo root. The CLI
      # downloads the gallery templates at the commit the templates submodule is pinned to.
      - name: Pack
        run: |
          mkdir -p npm-tarballs
          printf '{ "commit": "%s" }\n' "$(git rev-parse HEAD:templates)" > packages/cli/gallery.json
          for pkg in runtime cli create-skathi; do
            cp LICENSE-MIT LICENSE-APACHE "packages/$pkg/"
            (cd "packages/$pkg" && bun pm pack --destination ../../npm-tarballs)
          done
          ls -l npm-tarballs
      # The runtime first: the published CLI depends on it at exactly this version. A re-run skips
      # what is already published. A prerelease (0.1.0-beta.1) goes to its own dist-tag, not latest.
      - name: Publish
        run: |
          version="${TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"
            dist_tag="${pre%%.*}"
          fi
          for pkg in runtime cli create-skathi; do
            if [[ "$pkg" == create-* ]]; then name="$pkg"; file="$pkg"; else name="@skathi-native/$pkg"; file="skathi-native-$pkg"; fi
            if [[ "$(npm view "$name@$version" version 2>/dev/null)" == "$version" ]]; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "./npm-tarballs/$file-$version.tgz" --access public --provenance --tag "$dist_tag"
          done
