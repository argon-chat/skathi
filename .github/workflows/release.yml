name: Release

# A `v<version>` tag publishes the prebuilt hosts `sk build` and `sk dev` download (cli/host-fetch.ts):
# every published variant and the dev host for Windows x64 and macOS arm64, gzipped, plus hosts.json.
# The Windows hosts with devtools embed the inspector's native AOT image (scripts/aot/prepare-inspector.ts).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, v<packages/cli version>"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Hosts (Windows x64)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      # Outside the workspace: checkout's clean would otherwise drop the incremental build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../skathi-release-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Discover installed LLVM
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (Test-Path -LiteralPath $llvm) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $llvm }
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Check the tag
        run: bun scripts/release-hosts.ts --check-tag $env:TAG
      - name: Cache verified native inputs
        uses: actions/cache@v4
        with:
          path: |
            vendor/redjs/prebuilt
            vendor/redjs/redjs/cpp/mimalloc
          key: windows-native-inputs-${{ hashFiles('vendor/redjs/pins.txt') }}
      - name: Fetch and verify native dependencies
        run: ./vendor/redjs/setup.ps1
      - name: Cache the native AOT toolchain
        uses: actions/cache@v4
        with:
          path: .tools/native-aot
          key: windows-native-inspector-${{ hashFiles('scripts/aot/toolchain.lock.json', 'scripts/aot/generate-table.ts', 'vendor/redjs/pins.txt') }}
      - name: Prepare the native inspector image
        run: bun scripts/aot/prepare-inspector.ts --out release-inspector --cache .tools/native-aot --target-dir $env:CARGO_TARGET_DIR
      - name: Build and pack the hosts
        run: bun scripts/release-hosts.ts --out release-hosts --native-inspector release-inspector/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: hosts-windows
          path: release-hosts/
          if-no-files-found: error

  macos:
    name: Hosts (macOS arm64)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../skathi-release-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin
      - name: Install the Metal toolchain
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Check the tag
        run: bun scripts/release-hosts.ts --check-tag "$TAG"
      - name: Cache verified native inputs
        uses: actions/cache@v4
        with:
          path: |
            vendor/redjs/prebuilt
            vendor/redjs/redjs/cpp/mimalloc
          key: macos-arm64-native-inputs-${{ hashFiles('vendor/redjs/pins.txt') }}
      - name: Fetch and verify native dependencies
        run: bash vendor/redjs/setup.sh
      - name: Build and pack the hosts
        run: bun scripts/release-hosts.ts --out release-hosts
      - uses: actions/upload-artifact@v4
        with:
          name: hosts-macos
          path: release-hosts/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, macos]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: hosts-*
          path: release-hosts
          merge-multiple: true
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Write hosts.json
        run: bun scripts/release-hosts.ts --merge release-hosts
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-hosts/*.gz
            release-hosts/hosts.json
