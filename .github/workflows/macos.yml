name: macOS

# Bring-up of the macOS host: checks and builds vn-app for Apple Silicon. Not a required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Xcode's Metal toolchain
        # Shaders compile at build time, so a Metal error fails here, not at first frame.
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Set up Rust
        run: rustup target add "$TARGET"
      - name: Install JS dependencies
        working-directory: packages/vue-native
        run: bun install --frozen-lockfile
      - name: Cache pinned native dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor/redjs/prebuilt
            vendor/redjs/redjs/cpp/mimalloc
          key: redjs-native-macos-${{ runner.arch }}-${{ hashFiles('vendor/redjs/pins.txt') }}
      - name: Fetch and verify native dependencies
        run: bash vendor/redjs/setup.sh
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-macos-${{ runner.arch }}-
      - name: Check the host
        run: cargo check --locked -p vn-app --target "$TARGET"
      - name: Build the bare host
        run: cargo build --locked --release -p vn-app --target "$TARGET" --features prod
