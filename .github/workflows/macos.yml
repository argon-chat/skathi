name: macOS

# Bring-up of the macOS host: checks and builds sk-app for Apple Silicon. Not a required check.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (aarch64-apple-darwin)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-apple-darwin
      # Outside the workspace: checkout's clean would otherwise drop the incremental build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../skathi-macos-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal --target "$TARGET"
      - name: Install Xcode's Metal toolchain
        # Shaders compile at build time, so a Metal error fails here, not at first frame.
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Cache pinned native dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor/redjs/prebuilt
            vendor/redjs/redjs/cpp/mimalloc
          key: macos-arm64-native-inputs-${{ hashFiles('vendor/redjs/pins.txt') }}
      - name: Fetch and verify native dependencies
        run: bash vendor/redjs/setup.sh
      - name: Check the host
        run: cargo check --locked -p sk-app --target "$TARGET"
      - name: Build the bare host
        run: cargo build --locked --release -p sk-app --target "$TARGET" --features prod
