name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime and builder
    runs-on: [self-hosted, X64, Linux]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/vue-native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The AOT input tests read vendor/redjs/pins.txt.
          submodules: false
      - name: Check out pinned redjs metadata
        run: git -C ../.. submodule update --init --depth 1 -- vendor/redjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # vue-tsc patches tsc through Node's fs.readFileSync; run by bun (a runner with no node) it is plain tsc
      # and every .vue import fails to resolve.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check runtime types
        run: bun run typecheck
      - name: Run runtime and builder tests
        run: bun test ./test

  licenses:
    name: Crate licenses
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # cargo metadata resolves the path dependencies in vendor/.
          submodules: recursive
      - name: Install the pinned Rust toolchain
        # cargo deny runs cargo metadata.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check crate licenses
        run: cargo deny check licenses
