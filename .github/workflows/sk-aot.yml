name: macOS workload qualification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate SDK commit
        required: true
      rebuild_hosts:
        description: Rebuild the SDK release hosts using the compiler from the supplied run
        type: boolean
        default: false
      wide_app:
        description: Compile the test apps with wide references on the supplied host
        type: boolean
        default: false
      profile_probe:
        description: Compare default and compact memory profiles in the release hosts
        type: boolean
        default: false
      jit_probe:
        description: Check first-frame and scroll instrumentation with the stock host
        type: boolean
        default: false
      workloads:
        description: Run which uploaded the release workloads
        required: true
        default: "44865937995"
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: aarch64-apple-darwin
      - if: inputs.rebuild_hosts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aot-workloads
      - if: inputs.rebuild_hosts
        uses: actions/download-artifact@v4
        with:
          name: sk-aot-macos-arm64
          run-id: ${{ inputs.workloads }}
          github-token: ${{ github.token }}
          path: .tools/sk-aot
      - if: inputs.rebuild_hosts
        uses: ./.github/actions/macos-aot
        with:
          benchmarks: "true"
      - if: ${{ !inputs.rebuild_hosts }}
        uses: ./.github/actions/css-checker
      - if: ${{ !inputs.rebuild_hosts }}
        uses: actions/download-artifact@v4
        with:
          name: skathi-macos-arm64-workloads
          run-id: ${{ inputs.workloads }}
          github-token: ${{ github.token }}
          path: release-hosts
      - name: Check the native image heap reservation
        if: inputs.profile_probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("scripts/aot/verify-macos.ts")
          prefix, marker, _ = src.read_text().partition('const minimal = make("minimal");')
          assert marker
          src.with_name("probe-profile.ts").write_text(prefix + '''
          const minimal = make("minimal");
          for (const [label, host, jit] of [["normal",normal,true], ["nojit",nojit,false]] as const) {
            const app = publish(minimal, label, host, true, jit);
            for (const [test, options] of Object.entries({defaults:{}, noWasm:{JSC_useWasm:"false"}, earlyAot:{JSC_useAOT:"true"}, earlyAotNoJit:{JSC_useAOT:"true", JSC_useJIT:"false"}})) {
              const result = spawnSync(app.exe, [], {encoding:"utf8", timeout:20_000, env:{...process.env, ...options, JSC_dumpOptions:"2", SK_SCENARIO:"aot-smoke", SK_PERF:"1"}});
              console.log(label, test, "status", result.status, "signal", result.signal, result.stdout);
              console.log((result.stderr ?? "").split(String.fromCharCode(10)).filter(line => /\b(useAOT|useJIT|useWasm|markedBlockCageSizeInMB|sizeClassProgression)\b|native-aot|sk-perf.*first-frame/.test(line)).join(String.fromCharCode(10)));
            }
          }
          ''')
          PY
          bun scripts/aot/probe-profile.ts --hosts release-hosts --out target/mac-aot-qualification
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/cli/aot/native.ts")
          old = 'ir, image, ...flags]'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'ir, image, ...flags, "--option", "references=wide"]'))
          PY
          echo "Wide-reference compile probe"
          bun scripts/aot/probe-profile.ts --hosts release-hosts --out target/mac-aot-wide
      - name: Compile with wide references
        if: inputs.wide_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/cli/aot/native.ts")
          old = 'ir, image, ...flags]'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'ir, image, ...flags, "--option", "references=wide"]'))
          PY
      - name: Exercise GUI measurement instruments
        if: inputs.jit_probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("scripts/aot/verify-macos.ts")
          prefix, marker, _ = src.read_text().partition('const minimal = make("minimal");')
          assert marker
          src.with_name("probe-benchmark.ts").write_text(prefix + '''
          for (const name of ["minimal", "showcase"] as const) {
            const published = publish(make(name), name + "-jit", normal, false, true);
            smoke(published.exe, false);
          }
          writeFileSync(join(dir, "apps.json"), JSON.stringify(Object.fromEntries(apps)));
          ''')
          PY
          bun scripts/aot/probe-benchmark.ts --hosts release-hosts --out target/mac-aot-qualification
          python3 - <<'PY'
          import json, pathlib, runpy, tempfile
          bench = runpy.run_path("benches/nojit/macos.py")
          apps = json.loads(pathlib.Path("target/mac-aot-qualification/apps.json").read_text())
          with tempfile.TemporaryDirectory() as folder:
              for name, path in apps.items():
                  exe = bench["executable"](pathlib.Path(path))
                  profile = pathlib.Path(folder) / name
                  for scroll in ([False, True] if name == "showcase-jit" else [False]):
                      sample = bench["capture"](exe, "jit", profile, 5, 60, scroll=scroll)
                      print(name, {k: v for k, v in sample.items() if k != "intervalsMs"}, flush=True)
          PY
      - if: ${{ !inputs.rebuild_hosts && !inputs.jit_probe && !inputs.profile_probe }}
        run: bun scripts/aot/verify-macos.ts --hosts release-hosts --out target/mac-aot-qualification --bench-apps
      - name: Measure startup, memory, disk size and scrolling
        if: ${{ !inputs.rebuild_hosts && !inputs.jit_probe && !inputs.profile_probe }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = pathlib.Path("target/mac-aot-qualification")
          apps = json.loads((out / "apps.json").read_text())
          args = []
          for key, path in apps.items():
              if key == "devtools":
                  continue
              args.extend(["--" + key, path])
              subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", path, out / (key + ".zip")], check=True)
          subprocess.run(["python3", "benches/nojit/macos.py", *args, "--out", out / "measurements.json"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-aot-measurements
          path: |
            target/mac-aot-qualification/*.zip
            target/mac-aot-qualification/measurements.json
          if-no-files-found: ignore
