name: macOS 26 GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      measurements:
        description: Diagnostics to run
        type: choice
        default: all
        options:
          - all
          - surface
          - controls

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: macOS 26 GPU diagnostics
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-26-diagnostics-aarch64
      - name: Measure launch footprint, active displays and Metal drawables
        env:
          MEASUREMENTS: ${{ inputs.measurements }}
        run: bash .github/scripts/macos26-diagnostics.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos26-gpu-diagnostics
          path: ${{ runner.temp }}/skathi-macos26-results/
          if-no-files-found: ignore
