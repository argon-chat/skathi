name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.macos_runner) || '' }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (types, tests, format)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The AOT input tests read vendor/redjs/redjs/pins.txt; the create tests copy the gallery templates; the CSS
      # checker builds sk-css, which needs gpui and taffy.
      - name: Check out pinned redjs metadata, gpui, taffy and the templates
        run: git submodule update --init --depth 1 -- vendor/redjs vendor/gpui vendor/taffy templates
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # vue-tsc patches tsc through Node's fs.readFileSync; run by bun it is plain tsc and .vue imports fail.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run typecheck
      - name: Svelte custom renderer on the latest 5.59 patch
        run: |
          root="$RUNNER_TEMP/sk-svelte-compat"
          mkdir -p "$root"
          echo '{"private":true,"dependencies":{"svelte":"~5.59.0"}}' > "$root/package.json"
          bun install --cwd "$root"
          SK_SVELTE_TEST_ROOT="$root" bun test ./packages/cli/test/svelte-renderer.test.ts
      # Downloads the pinned redslangc, which the effect tests then use from the cache.
      - name: Generated effect shaders are current
        run: bun run shaders:check
      - uses: ./.github/actions/css-checker
      - name: Tests
        run: bun run test
      - name: Format
        run: bun fmt --check
      - name: Generated preludes are current
        run: bun run preludes:check

  packages:
    name: Packed packages (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS arm64
            os: macos-15
          - name: Linux x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out gpui, taffy, redjs and the templates
        run: git submodule update --init --depth 1 -- vendor/redjs vendor/gpui vendor/taffy templates
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The CLI's prepack builds the release CSS checker; this makes that a cache hit.
      - uses: ./.github/actions/css-checker
        with:
          release: true
      - name: Apps from the packed runtime and CLI
        run: bun scripts/smoke-packages.ts

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            os: ${{ inputs.macos_runner || 'macos-15' }}
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Debug info is most of a test build's disk; a hosted runner has little.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # A JSC pin bump fails here until the entry points the aot-nojit workload removes (the JIT's,
      # WebAssembly's) are reviewed.
      - if: runner.os == 'Windows'
        name: Removed entry points match the pinned engine
        run: bun scripts/aot/no-jit.ts --check
      - if: runner.os == 'macOS'
        name: Signed Mach-O image unwinds into its caller
        run: bun scripts/aot/verify-macho.ts
      - if: runner.os == 'macOS'
        name: Hardened runtime validates the signed Mach-O image
        run: bun scripts/aot/verify-macho.ts --verify-hardened
      # sk-video loads GStreamer at runtime: its end-to-end test needs the plugins, not -dev packages.
      - if: runner.os == 'Linux'
        name: GStreamer runtime
        run: |
          sudo -n apt-get update -q
          sudo -n apt-get install -y -q --no-install-recommends gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav
          echo "SK_VIDEO_REQUIRE_GSTREAMER=1" >> "$GITHUB_ENV"
      # The Metal renderer compiles these at run time; a library compile catches what Slang got wrong.
      - if: runner.os == 'macOS'
        name: Generated MSL compiles
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          for f in crates/sk-effects/generated/*.metal; do
            xcrun -sdk macosx metal -c "$f" -o /dev/null
          done
      # The workspace's `profile.dev.package."*"` debug setting outranks CARGO_PROFILE_DEV_DEBUG.
      - name: Tests
        run: cargo test --locked --workspace --target ${{ matrix.target }} --config "profile.dev.package.'*'.debug=0"
      - if: runner.os == 'Linux'
        name: CSS reference covers native property support
        shell: bash
        run: |
          cargo run --locked --quiet --target ${{ matrix.target }} --config "profile.dev.package.'*'.debug=0" -p sk-css --example css-catalog |
            bun scripts/check-css-reference.ts
      - name: sk-tree without video
        run: cargo test --locked -p sk-tree --lib --no-default-features --features webgpu,lottie --target ${{ matrix.target }} --config "profile.dev.package.'*'.debug=0"
      - name: Release host builds
        run: cargo check --locked -p sk-app --features prod --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        name: Metal HDR preserves signed surface colors
        working-directory: vendor/gpui
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked -p skathi-gpui-apple --lib --target ${{ matrix.target }} --config "profile.dev.package.'*'.debug=0" \
            metal_renderer::tests::hdr_output_preserves_signed_surfaces -- --exact --nocapture

  e2e:
    name: E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: ${{ inputs.macos_runner || 'macos-15' }}
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/native
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.target }}
          cache-on-failure: true
      # No GPU on a hosted runner: lavapipe (Vulkan) or llvmpipe (GL) under Xvfb, with a window manager
      # for minimize, maximize and fullscreen.
      - if: runner.os == 'Linux'
        name: Display and runtime packages
        run: |
          sudo -n apt-get update -q
          sudo -n apt-get install -y -q --no-install-recommends xvfb xauth openbox mesa-vulkan-drivers libvulkan1 \
            libegl1 libgl1-mesa-dri libxkbcommon-x11-0 fonts-dejavu-core gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav
      # Not a workspace member: the packaging spec builds it.
      - name: shadcn app dependencies
        run: bun install --frozen-lockfile --cwd apps/shadcn
      # The hosted VM boots at 1024x768, smaller than several spec windows.
      - if: runner.os == 'macOS'
        name: Display
        run: |
          brew install --quiet displayplacer
          id=$(displayplacer list | awk '/^Persistent screen id:/ { print $4; exit }')
          displayplacer "id:$id res:1920x1080 hz:60 color_depth:7 scaling:off origin:(0,0) degree:0"
          displayplacer list | grep -m1 '^Resolution:'
      # A partial restore of the CSS checker's Rust cache cleans target/, including a built host.
      - uses: ./.github/actions/css-checker
      - name: Host
        run: cargo build --locked -p sk-app --target ${{ matrix.target }}
      # -noreset: the server must not reset between two hosts, or the next one cannot connect.
      - if: runner.os == 'Linux'
        name: Specs
        working-directory: packages/test
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -noreset" sh -c 'openbox & bun test specs --timeout 30000'
      # The macOS VM drops an occasional input or frame; a test gets two more tries there.
      - if: runner.os == 'macOS'
        name: Specs
        working-directory: packages/test
        run: bun test specs --timeout 30000 --retry 2
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.target }}
          path: |
            .sk-test-artifacts/
            packages/test/.sk-test/logs/
          if-no-files-found: ignore
          include-hidden-files: true

  rustfmt:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - run: cargo fmt --check

  licenses:
    name: Crate licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # cargo metadata resolves the path dependencies in vendor/.
          submodules: recursive
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses
