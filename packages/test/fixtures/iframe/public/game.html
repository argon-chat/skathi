<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fixture game</title>
<style>
  html, body { margin: 0; height: 100%; background: rgb(0, 160, 80); color: white; font: 16px sans-serif; }
  #box { position: absolute; left: 0; top: 0; width: 60px; height: 40px; background: rgb(200, 30, 30); }
</style>
</head>
<body>
<div id="box"></div>
<p id="status">game</p>
<script>
// The document a Skathi <iframe> loads in packages/test/specs/
// iframe-document.spec.ts. It speaks the way a PlayFrame game does: to
// `window.parent`, first with "*", then with the origin its parent's first
// message came from.
(() => {
  const say = (data, target) => window.parent.postMessage(data, target || "*");
  let hostOrigin = null;
  let clicks = 0;
  let keys = "";

  window.addEventListener("message", (e) => {
    if (hostOrigin === null) hostOrigin = e.origin;
    const m = e.data;
    if (m && m.type === "escape") {
      // What a sandboxed frame must not be able to do.
      const tried = {};
      try { window.top.location.href = "https://example.invalid/"; tried.top = "navigated"; } catch (err) { tried.top = err.name; }
      try { tried.parentDoc = String(window.parent.document); } catch (err) { tried.parentDoc = err.name; }
      tried.bridge = typeof (window.chrome && window.chrome.webview);
      say({ type: "escaped", tried }, hostOrigin);
      return;
    }
    say({
      type: "echo",
      data: m,
      kinds: m && typeof m === "object" ? Object.fromEntries(Object.entries(m).map(([k, v]) => [k, Object.prototype.toString.call(v)])) : null,
      sourceIsParent: e.source === window.parent,
      originIsStable: e.origin === hostOrigin,
    }, hostOrigin);
  });

  document.addEventListener("mousedown", (e) => {
    clicks++;
    say({ type: "click", x: Math.round(e.clientX), y: Math.round(e.clientY), clicks, onBox: e.target.id === "box" });
  });
  document.addEventListener("keydown", (e) => {
    keys += e.key;
    say({ type: "key", keys });
  });
  document.addEventListener("visibilitychange", () => say({ type: "visibility", state: document.visibilityState }));

  say({
    type: "hello",
    framed: window.parent !== window,
    // The document's own origin: opaque ("null") under a sandbox without allow-same-origin.
    origin: self.origin,
    size: [window.innerWidth, window.innerHeight],
    dpr: window.devicePixelRatio,
  });
})();
</script>
</body>
</html>
