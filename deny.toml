# cargo deny check licenses
# The host is shipped as a binary under MIT OR Apache-2.0, so every crate in it must allow that:
# permissive licenses, plus MPL-2.0 (file-level copyleft: lightningcss, cssparser, symphonia).
# No GPL, AGPL or LGPL crate: Zed's own crates are mostly GPL-3.0, only the gpui family is Apache-2.0.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true
