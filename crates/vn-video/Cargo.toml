[package]
name = "vn-video"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# DESIGNED, NOT BUILT (see CONTRACT.md §9). An opt-in vendored software AV1
# decoder (dav1d, BSD-2) for machines whose Windows image has no
# `Microsoft.AV1VideoExtension`. It is a feature rather than a dependency
# because the whole thesis of this crate is "use the platform's decoder": dav1d
# is documented at 42.8-162.9 MB of RAM for 1080p and adds ~1 MB of binary, and
# the owner's RAM budget says that is never the default.
#
# Turning it on today changes nothing except a clearer advisory; the decoder
# itself is not vendored.
av1-software = []

[dependencies]
# The frame a backend produces is a `gpui::RenderImage` — the same currency
# `<img>` and `<lottie>` already pay the atlas in. See CONTRACT.md §5 for why
# that, and not a zero-copy texture, is the v1 choice.
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
vn-resample = { path = "../vn-resample" }

[target.'cfg(windows)'.dependencies]
# 0.62 rather than the 0.61 gpui_windows uses: Media Foundation coverage is
# complete here (IMFMediaEngine, IMFMediaEngineEx, IMFMediaEngineNotify,
# IMFDXGIDeviceManager and every attribute GUID we need are all typed), and the
# two versions never have to agree because the D3D11 device crosses the
# boundary as a raw COM pointer — an ABI, not a type. See `mf::Backend::new`.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `CreateStreamOnHGlobal` needs a block to wrap: a `data:` URI's bytes go
    # HGLOBAL -> IStream -> IMFByteStream -> IMFMediaEngineEx, never a file.
    "Win32_System_Memory",
    "Win32_System_Variant",
] }
windows-core = "0.62"
