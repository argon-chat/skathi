[package]
name = "vn-video"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Opt-in software AV1 decoder (dav1d) for machines without `Microsoft.AV1VideoExtension`. Not
# vendored yet: enabling it only gives a clearer advisory.
av1-software = []

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
vn-resample = { path = "../vn-resample" }

[target.'cfg(windows)'.dependencies]
# 0.62, not gpui_windows' 0.61: the D3D11 device crosses the boundary as a raw COM pointer, so the
# versions need not agree.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `CreateStreamOnHGlobal`: a `data:` URI's bytes go HGLOBAL -> IStream -> IMFByteStream.
    "Win32_System_Memory",
    "Win32_System_Variant",
] }
windows-core = "0.62"
