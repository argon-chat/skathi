[package]
name = "vn-effects"
version = "0.1.0"
edition = "2021"
publish = false

# The `--shading` effect registry: names, arguments and defaults. DATA plus the `.slang` sources and
# their checked-in slangc output (`shaders/`, `generated/`); no rendering code (gpui owns the
# primitive, gpui_windows the pipelines, vn-css the grammar). The schemas are slangc's reflection,
# emitted as `effects.json` by `bun shaders.ts`; `cargo build` never invokes slangc.

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
