[package]
name = "vn-effects"
version = "0.1.0"
edition = "2021"
publish = false

# The `--shading` effect registry: what each built-in effect is called, what
# arguments it takes, and what those arguments default to.
#
# This crate is DATA plus the `.slang` sources and their checked-in slangc
# output (`shaders/` and `generated/`). It deliberately holds no rendering code:
# the primitive lives in gpui, the pipelines in gpui_windows, and the CSS
# grammar in vn-css. What lives here is the single description all three agree
# on. `cargo build` never invokes slangc — see docs/SHADERS.md §2.3.

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
