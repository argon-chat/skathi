[package]
name = "sk-webview"
description = "<iframe> for Skathi: a document in the platform webview, under the app surface"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
sk-tree = { path = "../sk-tree", version = "0.3.0", default-features = false }
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.3.0", default-features = false }
serde_json = "1"
raw-window-handle = "0.6"

# WebView2 in composition mode, under the app surface.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
