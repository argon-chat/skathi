[package]
name = "sk-webview"
description = "<iframe> for Skathi: a document in the platform webview, under the app surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
sk-tree = { path = "../sk-tree", version = "0.9.0", default-features = false }
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.9.0", default-features = false }
serde_json = "1"
raw-window-handle = "0.6"

# WebView2 in composition mode, under the app surface.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# WKWebView in a view under the app's Metal layer.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphicsContext",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKOpenPanelParameters",
    "WKPreferences",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKSecurityOrigin",
    "WKUIDelegate",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWindowFeatures",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSGraphics", "NSRunningApplication"] }

# Runs WebKit on the main thread's run loop, so it is its own harness.
[[test]]
name = "mac_webview"
harness = false
