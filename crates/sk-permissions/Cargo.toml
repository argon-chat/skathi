[package]
name = "sk-permissions"
description = "Platform permission backends behind Skathi's navigator.permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The capture latches (`SK_MEDIA_CAPTURE=deny|fake`) live in redjs's `mediastream`, which exists
# only with Web Audio; without it the latches read as never set.
audio = ["sk-runtime/audio"]

[dependencies]
# `PermissionHost`, `Capability` and `PermissionState` are defined in redjs; only the backends
# live here.
sk-runtime = { path = "../sk-runtime", version = "0.9.0", default-features = false }
# `permissions.json`, the app's answers to its own prompt (src/decisions.rs).
serde_json = "1"
sk-locale = { path = "../sk-locale", version = "0.9.0" }

[target.'cfg(target_os = "windows")'.dependencies]
# `AppCapability` only asks Windows' own consent question for a packaged app; states come from
# the registry (see win.rs).
sk-windows = { path = "../sk-windows", version = "0.9.0", features = ["raw", "runtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Versions already pinned by the SDK's AppKit backend; AVFoundation is linked directly.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
