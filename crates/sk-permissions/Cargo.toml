[package]
name = "sk-permissions"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The capture latches (`SK_MEDIA_CAPTURE=deny|fake`) live in redjs's `mediastream`, which exists
# only with Web Audio; without it the latches read as never set.
audio = ["sk-runtime/audio"]

[dependencies]
# `PermissionHost`, `Capability` and `PermissionState` are defined in redjs; only the backends
# live here.
sk-runtime = { path = "../sk-runtime", default-features = false }
# `permissions.json`, the app's answers to its own prompt (src/decisions.rs).
serde_json = "1"
sk-locale = { path = "../sk-locale" }

[target.'cfg(target_os = "windows")'.dependencies]
# 0.62 like `sk-video`: this crate shares no types with gpui. Everything here is a state read or
# a shell open; `Security_Authorization_AppCapabilityAccess` is absent on purpose (see win.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Versions already pinned by the SDK's AppKit backend; AVFoundation is linked directly.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
