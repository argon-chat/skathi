[package]
name = "sk-permissions"
description = "Platform permission backends behind Skathi's navigator.permissions"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The capture latches (`SK_MEDIA_CAPTURE=deny|fake`) live in redjs's `mediastream`, which exists
# only with Web Audio; without it the latches read as never set.
audio = ["sk-runtime/audio"]

[dependencies]
# `PermissionHost`, `Capability` and `PermissionState` are defined in redjs; only the backends
# live here.
sk-runtime = { path = "../sk-runtime", version = "0.6.1", default-features = false }
# `permissions.json`, the app's answers to its own prompt (src/decisions.rs).
serde_json = "1"
sk-locale = { path = "../sk-locale", version = "0.6.1" }

[target.'cfg(target_os = "windows")'.dependencies]
# Everything here is a state read or a shell open; `Security_Authorization_AppCapabilityAccess`
# is absent on purpose (see win.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Versions already pinned by the SDK's AppKit backend; AVFoundation is linked directly.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
