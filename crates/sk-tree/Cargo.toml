[package]
name = "sk-tree"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["webgpu"]
webgpu = ["sk-runtime/webgpu"]

[dependencies]
gpui = { path = "../../vendor/gpui/crates/gpui", default-features = false }
sk-css = { path = "../sk-css" }
sk-effects = { path = "../sk-effects" }
sk-elements = { path = "../sk-elements" }
sk-lottie = { path = "../sk-lottie" }
sk-video = { path = "../sk-video" }
sk-sticker = { path = "../sk-sticker" }
sk-runtime = { path = "../sk-runtime", default-features = false }
sk-payload = { path = "../sk-payload" }
sk-resample = { path = "../sk-resample" }
# Same version and decoders gpui already builds.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff", "ico"] }
# Pinned to the version gpui resolves.
usvg = { version = "0.46.0", default-features = false }
# Pinned to the version sk-css uses.
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
# WOFF/WOFF2 are unpacked by DirectWrite (`UnpackFontFile`).
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[target.'cfg(not(windows))'.dependencies]
# No DirectWrite here; Core Text and cosmic-text take only sfnt.
wuff = "0.2.10"
