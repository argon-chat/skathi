[package]
name = "sk-tree"
description = "Skathi's retained node tree and the renderer's host functions"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["webgpu", "lottie", "video"]
webgpu = ["sk-runtime/webgpu"]
# `<lottie>` and `<sk-sticker>` (ThorVG). Off, both lay out as empty boxes and warn once.
lottie = ["dep:sk-lottie", "dep:sk-sticker"]
# `<video>`, and `.webm` stickers when `lottie` is on.
video = ["dep:sk-video", "sk-sticker?/video"]

[dependencies]
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.5.1", default-features = false }
sk-css = { path = "../sk-css", version = "0.5.0" }
sk-effects = { path = "../sk-effects", version = "0.5.0" }
sk-elements = { path = "../sk-elements", version = "0.5.0" }
sk-lottie = { path = "../sk-lottie", version = "0.5.0", optional = true }
sk-video = { path = "../sk-video", version = "0.5.0", optional = true }
sk-sticker = { path = "../sk-sticker", version = "0.5.0", default-features = false, optional = true }
sk-runtime = { path = "../sk-runtime", version = "0.5.0", default-features = false }
sk-payload = { path = "../sk-payload", version = "0.5.0" }
sk-resample = { path = "../sk-resample", version = "0.5.0" }
# Same version and decoders gpui already builds.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff", "ico"] }
# Pinned to the version gpui resolves.
usvg = { version = "0.46.0", default-features = false }
svgtypes = "0.16.1"
# Pinned to the version sk-css uses.
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
futures = "0.3"
log = "0.4"
# `<sk-surface>` reads the display a window is on.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# WOFF/WOFF2 are unpacked by DirectWrite (`UnpackFontFile`); `<sk-surface>` copies D3D11/D3D12 textures;
# popups are owned, non-activating windows.
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# `<sk-surface>` copies Metal textures, IOSurfaces and CVPixelBuffers. The versions gpui uses.
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes", "CFString"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-io-surface",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLEvent",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

[dev-dependencies]
# `examples/predict-eval.rs` reads and writes pointer traces.
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLBuffer"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Popup windows: where the opener is on the root window, the monitor's work area, stacking.
x11rb = { version = "0.13.1", features = ["randr", "shape"] }

[target.'cfg(not(windows))'.dependencies]
# No DirectWrite here; Core Text and cosmic-text take only sfnt.
wuff = "0.2.10"
