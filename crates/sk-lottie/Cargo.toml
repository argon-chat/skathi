[package]
name = "sk-lottie"
description = "Lottie and .tgs playback behind Skathi's <lottie> element"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*"]

[features]
# ThorVG is the default renderer (wider coverage than `rasterlottie`). `default = []` puts
# `rasterlottie` back; `SK_LOTTIE_BACKEND=rasterlottie` does it at run time.
default = ["thorvg-default"]
# Compiles ThorVG in alongside `rasterlottie`; selectable per load or via `SK_LOTTIE_BACKEND`.
thorvg = ["dep:sk-thorvg-sys"]
# Makes ThorVG what a plain `LottieState::load` uses.
thorvg-default = ["thorvg"]

[dependencies]
# Pure-Rust Lottie parser + rasteriser (tiny-skia). Always compiled in: the fallback with no C++,
# and the only engine that gets `bell.json`'s Fill effect right.
#
# `gif` is off; `images` and `text` stay on for embedded images and glyph-backed text layers.
#
# Pinned exactly: `backend::raster` declares the prepared animation `Send` on an argument about
# rasterlottie's internals; an upgrade re-checks it.
rasterlottie = { version = "=0.2.2", default-features = false, features = [
    "images",
    "text",
] }
# ThorVG (C++ submodule) + checked-in FFI; `optional` so `--no-default-features` has no C++.
sk-thorvg-sys = { path = "../sk-thorvg-sys", version = "0.4.0", optional = true }
# `.tgs` is gzipped Lottie JSON; `rust_backend` keeps it pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The document is parsed here, before any backend (see `src/normalize.rs`).
serde_json = "1"
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.4.1", default-features = false }

[dev-dependencies]
gpui_platform = { package = "skathi-gpui-platform", path = "../../vendor/gpui/crates/gpui_platform", version = "0.4.1", default-features = false }
# `tests/playback.rs` reads the fixture documents to cross-check the ANIMATED list.
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# `examples/compare.rs --png` writes a frame per file per backend; encoder only.
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "normalize-neutrality"
required-features = ["thorvg"]
