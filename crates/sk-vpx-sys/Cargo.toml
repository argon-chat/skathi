[package]
name = "sk-vpx-sys"
version.workspace = true
edition = "2021"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository.workspace = true
homepage.workspace = true
include = ["src/**/*.rs", "build.rs", "sources.txt", "config/**/*", "csrc/**/*", "libvpx/**/*", "VENDOR.md"]
description = "libvpx 1.17's VP9 decoder, vendored and built with cc (no nasm), behind a small safe wrapper"
# A static archive of a vendored C tree: at most one crate in the graph may
# provide libvpx's symbols.
links = "vpx"

[features]
# Counts the calls into csrc/sk_vpx_asm_shim.c by group (tests only: shows
# which shim paths a clip reaches).
shim-stats = []

[build-dependencies]
cc = "1"
