[package]
name = "vn-lottie"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# ThorVG is the default renderer as of m11: it draws 25/25 of the measured
# corpus where `rasterlottie` draws 18/25, and it is closer to the upstream
# reference renders on every fixture. The measurements, and the one file it
# gets *wrong*, are in `research/reports/m11/thorvg.md`.
#
# Reverting is this one line — `default = []` puts `rasterlottie` back, and
# `VN_LOTTIE_BACKEND=rasterlottie` does it at run time with no rebuild.
default = ["thorvg-default"]
# Compiles the ThorVG backend in alongside `rasterlottie`. Both are then
# selectable per load (`LottieState::load_with`) or per process
# (`VN_LOTTIE_BACKEND`); this feature does NOT change which one `load` picks.
thorvg = ["dep:vn-thorvg-sys"]
# Makes ThorVG what a plain `LottieState::load` uses. Split from `thorvg` so
# the choice of default and the choice of what is compiled in stay separate:
# the comparison harness needs both engines with either default.
thorvg-default = ["thorvg"]

[dependencies]
# Pure-Rust Lottie parser + rasteriser (tiny-skia backend). No longer the
# default (see `[features]`), but always compiled in: it is the fallback with
# no C++ in it at all, and the only engine that gets `bell.json`'s Fill effect
# right. `research/reports/m10/lottie.md` is the original selection,
# `research/reports/m11/thorvg.md` the two-backend comparison.
#
# `gif` is off (we never export GIFs); `images` and `text` stay on because real
# Bodymovin exports lean on embedded image assets and glyph-backed text layers.
rasterlottie = { version = "0.2.2", default-features = false, features = [
    "images",
    "text",
] }
# Vendored ThorVG 1.1.0 (C++) + checked-in FFI. Still `optional`, so
# `--no-default-features` really does produce a build with no C++ in it;
# see `crates/vn-thorvg-sys/VENDOR.md` for the vendoring and the pin.
vn-thorvg-sys = { path = "../vn-thorvg-sys", optional = true }
# `.tgs` (Telegram sticker) is gzipped Lottie JSON, whichever backend draws it.
# `rust_backend` keeps the pure-Rust promise (miniz_oxide); the C `zlib`
# backend is deliberately unused.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The document is parsed here, before any backend: `LottieMeta` is read from it
# and the Bodymovin compatibility pass rewrites it — see `src/normalize.rs` for
# why that is not optional.
serde_json = "1"
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }

[dev-dependencies]
# Only the preview example needs a real window/event loop.
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false }
# `tests/playback.rs` reads the fixture documents directly to cross-check the
# ANIMATED list against what the files actually animate — the check that would
# have caught the fixtures README claiming a static file was animated. Both are
# already in the graph, so this adds nothing to the build.
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# `examples/compare.rs --png` writes a frame per file per backend, which is how
# "which one is right" is actually settled. Encoder only; the runtime dep above
# stays decoder-free.
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "normalize-neutrality"
# Talks to `vn-thorvg-sys` directly, so it only exists when that is compiled in.
required-features = ["thorvg"]
