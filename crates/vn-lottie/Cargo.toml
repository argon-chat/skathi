[package]
name = "vn-lottie"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pure-Rust Lottie parser + rasteriser (tiny-skia backend). Chosen over
# rlottie/thorvg because it needs no C/C++ toolchain, no cmake/meson and no
# system libraries: it drops straight into `cargo build` with `+crt-static`.
# See `research/reports/m10/lottie.md` for the full backend comparison.
#
# `gif` is off (we never export GIFs); `images` and `text` stay on because real
# Bodymovin exports lean on embedded image assets and glyph-backed text layers.
rasterlottie = { version = "0.2.2", default-features = false, features = [
    "images",
    "text",
] }
# `.tgs` (Telegram sticker) is gzipped Lottie JSON. `rust_backend` keeps the
# pure-Rust promise (miniz_oxide); the C `zlib` backend is deliberately unused.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The Bodymovin compatibility pass runs over the raw JSON before rasterlottie
# ever sees it — see `src/normalize.rs` for why that is not optional.
serde_json = "1"
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }

[dev-dependencies]
# Only the preview example needs a real window/event loop.
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false }
