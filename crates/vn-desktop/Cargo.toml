[package]
name = "vn-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# The desktop surface a browser does not have words for, plus the tier-1 pieces
# that have to reach the OS: the central argv parser, the shell (open a URL or a
# file, reveal, trash), single instance and the custom-protocol registration
# (docs/SHELL.md, docs/LAUNCH.md; research/reports/m25/desktop-apis-design.md).
#
# `args` is pure and dependency-free on purpose: it is what `main()` reads
# before anything else exists, and what the inspector mode is decided by.

[dependencies]
# The JS host seam (`host_fn!`, `JsRuntime`), exactly as vn-permissions uses it:
# every async call answers `{token}` synchronously and the per-frame pump settles
# it through ONE registered dispatcher.
vn-runtime = { path = "../vn-runtime", default-features = false }
# Already in the graph (gpui uses it), so this adds no crate to the build. The
# instance pipe's messages and vn.config's launch block are JSON, and both are
# parsed STRICTLY — a hand-rolled reader for input that crosses a process
# boundary is the wrong place to economise.
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 0.62, matching vn-permissions / vn-storage / vn-video (this crate shares no
# types with gpui, so it does not have to agree with gpui's 0.61).
#
#   UI_Shell(+Common)      ShellExecuteExW, SHOpenFolderAndSelectItems,
#                          IFileOperation (trash), SHChangeNotify
#   System_Com             the shell thread's STA
#   System_LibraryLoader   iphlpapi's connectivity hint, resolved at run time
#                          (navigator.onLine; Windows 10 2004+)
#   System_Pipes, IO       the single-instance pipe
#   System_Threading       the instance mutex, peer-process checks
#   System_RemoteDesktop   ProcessIdToSessionId (the pipe name is per session)
#   Security(+Authorization) the pipe's DACL and both ends' token-user check
#   Storage_FileSystem     CreateFileW on the pipe, file identity of the exe
#   System_Registry        per-user protocol registration (HKCU only)
#   Storage_Packaging_Appx GetCurrentPackageFullName (MSIX: skip the registry)
#   UI_WindowsAndMessaging raising the primary; AllowSetForegroundWindow
#   UI_Controls            TASKDIALOGCONFIG (the question dialog; the function
#                          itself is resolved at run time, dialog/win.rs)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement(IFileOperationProgressSink)]` expands to `::windows_core::…`
# paths, so the crate has to be nameable here. Same 0.62 the `windows` crate
# above already depends on.
windows-core = "0.62"
