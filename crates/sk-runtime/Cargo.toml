[package]
name = "sk-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Optional Battery Status API; applications choose whether to expose it.
battery = ["redjs/battery"]
native-aot = ["redjs/native-aot"]
# Native WebGPU; normal runtimes include it and the host supplies canvas presentation.
webgpu = ["dep:redjs-webgpu"]
# On by default: browser APIs an app expects (typeof checks stay truthful either way).
# Audio is the costliest feature after gpui (firewheel, cpal, symphonia); opt out with
# `--no-default-features` for headless hosts. Opting out removes the API, it does not stub it.
# `net-h2` pools HTTP/2 per origin; off, fetch uses redjs's blocking HTTP/1.1 transport.
default = ["audio", "storages", "clipboard", "indexeddb", "net-h2", "webgpu"]
# AAC/M4A, ALAC, AIFF, CAF and MKV for `decodeAudioData` input of arbitrary user files.
audio = ["redjs/audio", "redjs/audio-codecs-extra"]
storages = ["redjs/storages"]
clipboard = ["redjs/clipboard"]
# On its own: redjs's in-memory backend (nothing survives a restart).
indexeddb = ["redjs/indexeddb"]
# SQLite3 Multiple Ciphers backend (~0.9 MB of the release exe); enabled by sk-storage's
# `indexeddb` feature, since it only runs once an `IndexedDbHost` is installed.
indexeddb-disk = ["indexeddb", "redjs/indexeddb-sqlite"]
net-h2 = ["redjs/net-h2"]

[dependencies]
# `svg-images` and `canvas` are always on.
redjs = { path = "../../vendor/redjs/redjs", default-features = false, features = ["svg-images", "canvas"] }
redjs-webgpu = { path = "../../vendor/redjs/redjs/webgpu", optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
serde_json = "1"
