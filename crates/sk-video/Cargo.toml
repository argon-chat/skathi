[package]
name = "sk-video"
description = "<video> playback for Skathi: Media Foundation, AVFoundation and GStreamer backends"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "build.rs"]

[features]
default = []
webgpu = ["dep:redjs-webgpu", "windows/Win32_Graphics_Direct3D11on12", "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Security", "dep:objc2-metal", "objc2-core-video/CVPixelBufferIOSurface", "objc2-core-video/objc2-io-surface"]
# Opt-in software AV1 decoder (dav1d) for machines without `Microsoft.AV1VideoExtension`. Not
# vendored yet: enabling it only gives a clearer advisory.
av1-software = []

[[test]]
name = "avfoundation"
harness = false

[[test]]
name = "gstreamer"
harness = false

[[test]]
name = "audio_route"
harness = false

[dependencies]
redjs-webgpu = { path = "../../vendor/redjs/redjs/webgpu", version = "0.7.0", optional = true }
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.8.5", default-features = false }
# Same major as gpui's, so `image::Frame` unifies with `gpui::RenderImage`'s.
image = { version = "0.25", default-features = false }
sk-resample = { path = "../sk-resample", version = "0.8.5" }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
# 0.62, not gpui_windows' 0.61: the D3D11 device crosses the boundary as a raw COM pointer, so the
# versions need not agree.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `CreateStreamOnHGlobal`: a `data:` URI's bytes go HGLOBAL -> IStream -> IMFByteStream.
    "Win32_System_Memory",
    "Win32_System_Variant",
] }
windows-core = "0.62"

# GStreamer is dlopen'ed, never linked: the host must start on a system without it.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = [
    "std", "objc2-io-surface", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes",
] }
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
    "AVAsset",
    "AVAssetResourceLoader",
    "AVError",
    "AVMediaFormat",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "AVPlayerItemTrack",
    "AVAssetTrack",
    "AVTime",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMTime", "CMTimeRange"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSValue",
] }
