[package]
name = "sk-css"
description = "Skathi's stylesheets: parsing, the cascade and per-state refinements onto gpui styles"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "examples/css-check.rs"]

[dependencies]
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.7.0", default-features = false }
# MPL-2.0: link unmodified. parcel_selectors is pinned to the version lightningcss resolves so
# both share one `Selector` type; `into_owned` lets a compiled rule own its selector.
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["into_owned"] }
cssparser = "0.37"
parcel_selectors = "0.28.3"
serde = { version = "1", features = ["derive"] }
sk-effects = { path = "../sk-effects", version = "0.7.0" }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "css-check"
crate-type = ["cdylib"]
