[package]
name = "sk-css"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
# MPL-2.0: link unmodified. parcel_selectors is pinned to the version lightningcss resolves so
# both share one `Selector` type; `into_owned` lets a compiled rule own its selector.
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["into_owned"] }
parcel_selectors = "0.28.3"
sk-effects = { path = "../sk-effects" }
