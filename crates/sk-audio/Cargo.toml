[package]
name = "sk-audio"
description = "Spatial audio output for Skathi's Web Audio: Windows Sonic, Dolby Atmos and DTS objects through ISpatialAudioClient"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*"]

[dependencies]
redjs = { path = "../../vendor/redjs/redjs", version = "0.4.0", default-features = false, features = ["audio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Audio",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"
