[package]
name = "sk-audio"
description = "Spatial audio output for Skathi's Web Audio: Windows Sonic, Dolby Atmos and DTS objects through ISpatialAudioClient"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*"]

[dependencies]
redjs = { path = "../../vendor/redjs/redjs", version = "0.8.0", default-features = false, features = ["audio"] }

[target.'cfg(windows)'.dependencies]
sk-windows = { path = "../sk-windows", version = "0.9.0", features = ["win32", "runtime"] }
