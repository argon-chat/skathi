[package]
name = "sk-clipboard"
description = "navigator.clipboard for Skathi, over gpui's clipboard"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The `ClipboardHost` trait is declared in redjs and implemented here.
sk-runtime = { path = "../sk-runtime", version = "0.6.0", default-features = false, features = ["clipboard"] }
# Not a second clipboard: gpui already owns the OS clipboard for the native <input>, and two
# owners of one `OpenClipboard` race.
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.6.0", default-features = false }

# Item clipboard (src/win.rs); both crates are already in the graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
image = { version = "0.25.1", default-features = false, features = ["png"] }
