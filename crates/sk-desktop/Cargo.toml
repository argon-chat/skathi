[package]
name = "sk-desktop"
description = "Skathi's desktop integration: argv, shell, single instance, custom protocols and the tray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# `args` is pure and dependency-free on purpose: `main()` reads it before anything else exists.

[dependencies]
sk-runtime = { path = "../sk-runtime", version = "0.9.0", default-features = false }
serde_json = "1"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png"] }
sk-permissions = { path = "../sk-permissions", version = "0.9.0" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
sk-windows = { path = "../sk-windows", version = "0.9.0", features = ["raw", "win32", "runtime"] }
# `#[implement(...)]` expands to `::windows_core::` paths, so the crate must be nameable.
windows-core = "0.100"
windows-collections = "0.100"

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit and CoreGraphics have no binding here: classes are looked up by name.
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "FoundationErrors",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSColorPanel",
    "NSColorSpace",
    "NSControl",
    "NSDockTile",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSSharingService",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-media-player = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "ASAuthorization",
    "ASAuthorizationController",
    "ASAuthorizationCredential",
    "ASAuthorizationError",
    "ASAuthorizationPlatformPublicKeyCredentialAssertion",
    "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPlatformPublicKeyCredentialDescriptor",
    "ASAuthorizationPlatformPublicKeyCredentialProvider",
    "ASAuthorizationPlatformPublicKeyCredentialRegistration",
    "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest",
    "ASAuthorizationProvider",
    "ASAuthorizationPublicKeyCredentialAssertion",
    "ASAuthorizationPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPublicKeyCredentialConstants",
    "ASAuthorizationPublicKeyCredentialParameters",
    "ASAuthorizationPublicKeyCredentialRegistration",
    "ASAuthorizationPublicKeyCredentialRegistrationRequest",
    "ASAuthorizationRequest",
    "ASAuthorizationSecurityKeyPublicKeyCredentialAssertion",
    "ASAuthorizationSecurityKeyPublicKeyCredentialAssertionRequest",
    "ASAuthorizationSecurityKeyPublicKeyCredentialDescriptor",
    "ASAuthorizationSecurityKeyPublicKeyCredentialProvider",
    "ASAuthorizationSecurityKeyPublicKeyCredentialRegistration",
    "ASAuthorizationSecurityKeyPublicKeyCredentialRegistrationRequest",
    "ASCOSEConstants",
    "ASFoundation",
    "ASPublicKeyCredential",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "file_chooser"] }
async-io = "2"
futures-lite = "2"
# NetworkManager's connectivity and metered flag, for `skathi:network`; ashpd brings zbus in already.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
