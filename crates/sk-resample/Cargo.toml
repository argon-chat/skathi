[package]
name = "sk-resample"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The pixel kernel behind sk-tree's downscaled image copies, in a crate of its own so the dev profile can optimise it"

# Its own crate for the dev profile: `image::imageops::resize` is generic, so it is compiled in the
# crate that calls it, and inside sk-tree it ran unoptimised in every debug build (one image took
# 659 ms). The workspace root gives this crate `opt-level = 3` in dev.

[dependencies]
# The version gpui already builds, so nothing new is compiled. No decoder is needed: this crate only resizes.
image = { version = "0.25", default-features = false }
