[package]
name = "sk-image"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The empty shared-library container `sk build` fills with a native AOT image"

[lib]
name = "skimage"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Outside the Skathi workspace: no_std needs panic = "abort", which the hosts must not take.
[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
