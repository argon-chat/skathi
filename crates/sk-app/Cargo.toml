[package]
name = "sk-app"
description = "The Skathi host: windows, the event loop, the JS bindings and the embedding API"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "build.rs", "build_native_inspector.rs", "devtools/app.prod.js", "devtools/window.json"]
# Compiles `apps/devtools` into the executable and emits `cfg(sk_devtools)`.
build = "build.rs"

[features]
battery = ["sk-runtime/battery"]
native-aot = ["sk-runtime/native-aot"]
native-inspector = ["native-aot"]
# With `prod`: the aot-nojit workloads on Windows x64 and macOS arm64. The engine has no JIT, so the
# host runs only apps with a native image (redjs `no-jit` needs REDJS_NO_JIT_DIR).
no-jit = ["native-aot", "sk-runtime/no-jit"]
# With no-jit: no WebAssembly either; `WebAssembly` is undefined (the aot-nojit workload).
no-wasm = ["no-jit", "sk-runtime/no-wasm"]
# Experimental Windows x64 host for qualifying runtime dependencies on the interpreter.
no-interpreter = ["no-wasm", "sk-runtime/no-interpreter"]
native-dx12 = ["gpui_windows/native-dx12"]
# macOS: compile the Metal shaders at app start instead of build time, for a machine without
# Xcode's Metal toolchain. Shipped builds keep the precompiled library.
runtime-shaders = ["gpui_platform/runtime_shaders"]
webgpu = ["sk-runtime/webgpu", "sk-tree/webgpu", "dep:wgpu", "dep:pollster"]
# The bare host: the dev manifest/HMR polling is compiled out, and the app (bundle, window config,
# name, assets) is the SKPK payload `sk build` stamps into a copy of this exe (src/payload.rs,
# src/prod.rs). Not implied by `--release`; `sk workload build` opts in.
prod = []
# Links only the root locale of ICU's data (Windows, Linux): ~9 MB smaller. The rest ships as
# icu.skpk beside the app, which `sk build` cuts from the icudt<NN>l.dat cargo writes beside
# this exe, and the host loads at start unless sk.config.json says "intl": "invariant".
icu-root = ["redjs/icu-root"]

# `skathi:ffi`: the app may load the libraries its sk.config.json lists and call their C functions.
# Without it the module is there and `dlopen()` throws NotSupportedError.
ffi = []
# `skathi:process`: programs listed under `"permissions.process"` in sk.config.json, started without a
# shell. Off, `Process.spawn()` throws `NotSupportedError` and no spawning code is linked.
process = ["dep:regex"]

# Compiles out the devtools protocol listener, the embedded inspector and the F12 key, which every
# build includes otherwise (an app can also disable them at runtime). For a build that must prove
# no `eval` transport was compiled in: `cargo build -p sk-app --features prod,no-devtools`.
no-devtools = []

# Accepted no-op, so command lines written against `--features prod,devtools` keep working.
# `build.rs` fails the build if it is combined with `no-devtools`.
devtools = []

# Web Audio (`AudioContext` & co) via sk-runtime. `--no-default-features` builds a host with no
# audio, about 40 fewer crates.
default = ["audio", "spatial-audio", "storages", "clipboard", "indexeddb", "webgpu", "native-dx12", "types", "lottie", "video", "hotkeys", "webview", "ffi", "process"]
audio = ["sk-runtime/audio", "sk-permissions/audio"]
# `panningModel: "spatial"` and `AudioContext.spatialAudio`: Windows spatial audio objects.
spatial-audio = ["audio", "dep:sk-audio"]

# `localStorage` / `sessionStorage` and the `appStorage` extension. Off, the whole surface
# vanishes, so `typeof localStorage === "undefined"` tells the truth. No third-party dependency;
storages = ["sk-runtime/storages", "dep:sk-storage"]
# `navigator.clipboard`. Off, it is undefined; the native <input>'s Ctrl+C is unaffected (it
# shares gpui's clipboard, not this crate).
clipboard = ["sk-runtime/clipboard", "dep:sk-clipboard"]
# `indexedDB` + `navigator.storage`, no Rust dependency. With `storages` on the databases are
# encrypted SQLite files under the app's storage folder; with it off the in-memory backend runs
indexeddb = ["sk-runtime/indexeddb", "sk-storage?/indexeddb"]
# Native modules record their argument, result and event types (specta), and an embedding exe
# answers `--sk-host-types` with the app's `native:*` declarations.
types = ["dep:specta", "dep:specta-serde", "dep:specta-typescript"]
# `<lottie>` and `<sk-sticker>` (ThorVG). Off, both are empty boxes that warn once.
lottie = ["sk-tree/lottie", "dep:sk-sticker"]
# `<video>` over the OS player, and libvpx for `.webm` stickers. Off, `<video>` is an empty box.
video = ["sk-tree/video", "sk-sticker?/video"]
# `appHotkeys`. Off, it reports `available: false`, as on a platform without global hotkeys.
hotkeys = ["dep:sk-hotkeys"]
# `<iframe>` (WebView2 on Windows). Off, an `<iframe>` fires `error` and stays empty.
webview = ["dep:sk-webview"]

[dependencies]
# `stacker` makes `stacksafe` opt-in in gpui; an arbitrary-depth user DOM needs it for
# `Div::{request_layout,prepaint,paint}`. Features are additive, so this one line enables it for
# the whole binary.
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.7.0", default-features = false, features = [
    "stacker",
] }
# `skathi:image` decodes what redjs links for `createImageBitmap`, so no codec is added.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
log = "0.4"
raw-window-handle = "0.6"
anyhow = "1"
gpui_platform = { package = "skathi-gpui-platform", path = "../../vendor/gpui/crates/gpui_platform", version = "0.7.0", default-features = false }
# `skathi:toml`. `preserve_order`: a parsed table keeps the document's key order, as `JSON.parse` does.
encoding_rs = "0.8"
toml = { version = "1.1", features = ["preserve_order"] }
# `TextSearch` of `skathi:text`.
aho-corasick = "1"
# The argument patterns of `"permissions.process"`.
regex = { version = "1", optional = true }
sk-css = { path = "../sk-css", version = "0.7.0" }
sk-effects = { path = "../sk-effects", version = "0.7.0" }
sk-elements = { path = "../sk-elements", version = "0.7.0" }
# `default-features = false` here and in every dependent of sk-runtime: features unify across the
# graph, so one plain dependency would turn every sk-runtime default back on.
sk-runtime = { path = "../sk-runtime", version = "0.7.0", default-features = false, features = ["net-h2"] }
# Direct, so build.rs gets the engine pin (DEP_REDJS_WEBKIT_VERSION).
redjs = { path = "../../vendor/redjs/redjs", version = "0.6.0", default-features = false, features = ["canvas"] }
sk-tree = { path = "../sk-tree", version = "0.7.0", default-features = false }
sk-webview = { path = "../sk-webview", version = "0.7.0", optional = true }
sk-sticker = { path = "../sk-sticker", version = "0.7.0", default-features = false, optional = true }
sk-payload = { path = "../sk-payload", version = "0.7.0" }
sk-resample = { path = "../sk-resample", version = "0.7.0" }
memmap2 = "0.9"
self_cell = "1"
sk-desktop = { path = "../sk-desktop", version = "0.7.0" }
sk-ffi = { path = "../sk-ffi", version = "0.7.0" }
sk-hotkeys = { path = "../sk-hotkeys", version = "0.7.0", optional = true }
sk-audio = { path = "../sk-audio", version = "0.7.0", optional = true }
sk-permissions = { path = "../sk-permissions", version = "0.7.0" }
sk-locale = { path = "../sk-locale", version = "0.7.0" }
sk-storage = { path = "../sk-storage", version = "0.7.0", optional = true }
sk-clipboard = { path = "../sk-clipboard", version = "0.7.0", optional = true }
futures = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zmij = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"], optional = true }
specta-serde = { version = "=0.0.15", optional = true }
specta-typescript = { version = "=0.0.15", optional = true }

[dev-dependencies]
skathi-macros = { path = "../skathi-macros", version = "0.7.0", features = ["types"] }
# The marshalling conformance test compares against serde_json reading floats exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# examples/surface.rs renders D3D11 and D3D12 frames for `<sk-surface>`.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# examples/surface.rs renders Metal frames, IOSurfaces and CVPixelBuffers for `<sk-surface>`.
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-io-surface",
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLEvent",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
embed-resource = "=3.0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "skathi-gpui-platform", path = "../../vendor/gpui/crates/gpui_platform", version = "0.7.0", default-features = false, features = ["font-kit"] }
libc = "0.2"
mach2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# gpui's Linux display backends: Wayland where there is one, X11 elsewhere. Off, gpui_linux is a
# headless platform.
gpui_platform = { package = "skathi-gpui-platform", path = "../../vendor/gpui/crates/gpui_platform", version = "0.7.0", default-features = false, features = ["wayland", "x11"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "dx12"], optional = true }
pollster = { version = "0.4", optional = true }
gpui_windows = { package = "skathi-gpui-windows", path = "../../vendor/gpui/crates/gpui_windows", version = "0.7.0", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # `SetWindowSubclass`: a `<SkWindow :focusable="false">` answers `WM_MOUSEACTIVATE` itself.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # `UISettings.AdvancedEffectsEnabledChanged` (`prefers-reduced-transparency`).
    "Foundation",
    "UI",
    "UI_ViewManagement",
] }
# Plain functions whose `windows` modules are large and needed by nothing else.
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    # `PrintWindow`
    "Win32_Storage_Xps",
    # `RtlGetVersion`: the one version query Windows does not lie about for an unmanifested process.
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    # `skathi:process`: CreateProcessW, a job object per child, pipes.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

