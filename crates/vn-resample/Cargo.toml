[package]
name = "vn-resample"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The pixel kernel behind vn-tree's downscaled image copies, in a crate of its own so the dev profile can optimise it"

# Its own crate for the dev profile: `image::imageops::resize` is generic, so it is compiled in the
# crate that calls it, and inside vn-tree it ran unoptimised in every debug build (one image took
# 659 ms). The workspace root gives this crate `opt-level = 3` in dev.

[dependencies]
# The version gpui already builds, so nothing new is compiled. No decoder is needed: this crate only resizes.
image = { version = "0.25", default-features = false }
