[package]
name = "sk-effects"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The `--shading` effect registry: names, arguments and defaults. DATA plus the `.slang` sources and
# their checked-in compiler output (`shaders/`, `generated/`); no rendering code (gpui owns the
# primitive, the renderers the pipelines, sk-css the grammar). The schemas are Slang's reflection,
# emitted as `effects.json` by `bun run shaders`; `cargo build` never compiles a shader.

[dependencies]
gpui = { path = "../../vendor/gpui/crates/gpui", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
