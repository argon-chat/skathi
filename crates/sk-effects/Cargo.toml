[package]
name = "sk-effects"
description = "Skathi's `--shading` effect registry: names, arguments, defaults and compiled shaders"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "generated/**/*", "shaders/**/*"]

# The `--shading` effect registry: names, arguments and defaults. DATA plus the `.slang` sources and
# their checked-in compiler output (`shaders/`, `generated/`); no rendering code (gpui owns the
# primitive, the renderers the pipelines, sk-css the grammar). The schemas are Slang's reflection,
# emitted as `effects.json` by `bun run shaders`; `cargo build` never compiles a shader.

[dependencies]
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
