[package]
name = "vn-thorvg-sys"
version = "0.1.0"
edition = "2021"
publish = false
# Static archive from a vendored C++ tree, so the usual `links` contract
# applies: at most one crate in the graph may provide `thorvg`.
links = "thorvg"

[features]
# Upstream's own `meson_options.txt` defaults, minus what is not vendored
# (GPU engines, the SVG and WebP loaders). `expressions` is on because
# upstream's `extra` default contains `lottie_exp` — and because Lottie
# expressions are the one format feature no pure-Rust backend implements,
# which is half the reason this crate exists.
default = ["expressions", "png", "jpg", "fonts", "threads"]
expressions = []  # Lottie expressions via the vendored JerryScript (190 TUs)
png = []          # embedded PNG assets (lodepng, no system dep)
jpg = []          # embedded JPEG assets (built-in decoder)
fonts = []        # TTF/OTF/SFNT, for Lottie text layers with a real font
threads = []      # ThorVG's TaskScheduler; without it everything is serial
# Off by default, exactly as upstream's `simd` option is: AVX raises the
# runtime CPU baseline to Sandy Bridge for a rasteriser that is not the
# bottleneck at sticker sizes. Flip it to measure.
avx = []

[build-dependencies]
cc = "1"
