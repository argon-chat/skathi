[package]
name = "sk-gamepad"
description = "Native gamepad input and rumble for Skathi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
hex = "0.4"
sha2 = "0.11.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFSet", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "hid"] }

[target.'cfg(target_os = "windows")'.dependencies]
sk-windows = { path = "../sk-windows", version = "0.9.0", features = ["raw", "runtime"] }
