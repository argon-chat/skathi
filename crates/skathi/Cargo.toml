[package]
name = "skathi"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vue and Svelte apps as native desktop programs: embed the Skathi engine (gpui and JavaScriptCore) in your own executable"
readme = "README.md"
keywords = ["vue", "desktop", "gui", "javascriptcore", "gpui"]
categories = ["gui"]
include = ["src/**/*", "build.rs", "README.md"]
# Not a native library: tells an embedder's build script what its executable must carry
# (DEP_SKATHI_LINK_ARGS, DEP_SKATHI_WINDOWS_RESOURCES).
links = "skathi"

[features]
default = [
    "prod", "audio", "spatial-audio", "storages", "clipboard", "indexeddb", "webgpu", "native-dx12", "types",
    "lottie", "video", "hotkeys", "webview",
]
# Native module types: `skathi::Type` (derived by `#[skathi::data]`) and `--sk-host-types` (specta).
types = ["sk-app/types", "skathi-macros/types"]
# Runs an app payload built by `sk build`. Without it the host boots the dev output in `SK_DIST`.
prod = ["sk-app/prod"]
# Windows x64 and macOS arm64: load native application images using the pinned AOT builtin table.
native-aot = ["sk-app/native-aot"]
# Run the devtools inspector from its own native image. Implies `native-aot`.
native-inspector = ["sk-app/native-inspector"]
# Link the target's archive from `bun scripts/aot/no-jit.ts --out <dir>` via REDJS_NO_JIT_DIR.
no-jit = ["sk-app/no-jit"]
# Omit WebAssembly as well as the JIT. Use `--remove JIT,WebAssembly` for the archive.
no-wasm = ["sk-app/no-wasm"]
audio = ["sk-app/audio"]
# `panningModel: "spatial"`: Windows Sonic, Dolby Atmos and DTS objects. Implies `audio`.
spatial-audio = ["sk-app/spatial-audio"]
# Links only the root locale of ICU's data; see sk-app's `icu-root`.
icu-root = ["sk-app/icu-root"]
storages = ["sk-app/storages"]
clipboard = ["sk-app/clipboard"]
indexeddb = ["sk-app/indexeddb"]
webgpu = ["sk-app/webgpu"]
native-dx12 = ["sk-app/native-dx12"]
battery = ["sk-app/battery"]
no-devtools = ["sk-app/no-devtools"]
runtime-shaders = ["sk-app/runtime-shaders"]
# `<lottie>` and `<sk-sticker>` (ThorVG, C++).
lottie = ["sk-app/lottie"]
# `<video>` (the OS player) and WebM stickers (libvpx, C).
video = ["sk-app/video"]
# `appHotkeys` and `skathi::hotkeys`.
hotkeys = ["sk-app/hotkeys"]
# `<iframe>` (WebView2).
webview = ["sk-app/webview"]

[dependencies]
sk-app = { path = "../sk-app", version = "0.7.0", default-features = false }
skathi-macros = { path = "../skathi-macros", version = "0.7.0" }
# For its links metadata only (the Windows manifest).
gpui = { package = "skathi-gpui", path = "../../vendor/gpui/crates/gpui", version = "0.6.0", default-features = false }

[dev-dependencies]
serde_json = "1"
