[package]
name = "vn-tree"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["webgpu"]
webgpu = ["vn-runtime/webgpu"]

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
vn-css = { path = "../vn-css" }
vn-elements = { path = "../vn-elements" }
vn-lottie = { path = "../vn-lottie" }
vn-video = { path = "../vn-video" }
vn-sticker = { path = "../vn-sticker" }
vn-runtime = { path = "../vn-runtime", default-features = false }
vn-payload = { path = "../vn-payload" }
vn-resample = { path = "../vn-resample" }
# Same version and decoders gpui already builds.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff", "ico"] }
# Pinned to the version gpui resolves.
usvg = { version = "0.46.0", default-features = false }
# Pinned to the version vn-css uses.
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
# WOFF/WOFF2 are unpacked by DirectWrite (`UnpackFontFile`).
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[target.'cfg(not(windows))'.dependencies]
# No DirectWrite here; Core Text and cosmic-text take only sfnt.
wuff = "0.2.10"
