[package]
name = "vn-tree"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
vn-css = { path = "../vn-css" }
vn-elements = { path = "../vn-elements" }
# The `<lottie>` element's playback engine — see crates/vn-lottie/CONTRACT.md.
vn-lottie = { path = "../vn-lottie" }
# The `<video>` element playback engine - see crates/vn-video/CONTRACT.md.
vn-video = { path = "../vn-video" }
vn-runtime = { path = "../vn-runtime" }
# The ONE URL → asset-key normaliser (`content_key`), shared with vn-app's
# content provider so `<img>` and `fetch()` can never disagree about what a
# relative URL names — and, in a packaged exe, the key the payload store is
# searched with. No dependencies of its own.
vn-payload = { path = "../vn-payload" }
# A pasted bitmap is offered as image.png, as Chromium offers it (Windows
# hands a screenshot over as a DIB). The version and the decoders are the ones
# gpui already builds (vendor/zed/Cargo.toml), so nothing new is compiled.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff", "ico"] }
# The parser gpui feeds SVGs to — `<img src="x.svg">`'s natural size for its
# `load` event (crate::img::natural_size), and the parser the `<svg>` tests
# assert against. Pinned to the version gpui resolves (vendor/zed/Cargo.toml),
# so nothing new is compiled.
usvg = { version = "0.46.0", default-features = false }
