# The JSC prebuilt and redjs's C++ are /MT. bun_core::return_address() reads the frame pointer:
# without one, the resolver crashes reading any package.json above the input.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-C",
  "force-frame-pointers=yes",
  "-C",
  "link-arg=/STACK:8388608",
  "--cfg=bun_sema_mimalloc",
]

[target.aarch64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "--cfg=bun_sema_mimalloc"]

[env]
BUN_CODEGEN_DIR = { value = ".cache/bun/build/release-codegen/codegen", relative = true }
REDJS_AOT_BUILTIN_TABLE_DIR = { value = ".cache/table", relative = true }
