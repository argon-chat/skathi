# STUB. redjs (vendor/redjs/redjs) declares `redcss = { path = "../../redcss", optional = true }`
# — PEWPEW's in-house CSS parser. Cargo reads the manifest of every optional path dependency
# during resolution even when its feature is off, so the path must exist on disk. This stub
# satisfies resolution; vue-native builds redjs with `default-features = false` (no `css-host`),
# so this crate is never actually compiled. Enabling `css-host` outside PEWPEW fails loudly
# (see src/lib.rs).
[package]
name = "redcss"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
